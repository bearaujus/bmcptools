<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[[TITLE]]</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23007aff'/><text x='16' y='22' font-family='system-ui' font-size='20' font-weight='bold' text-anchor='middle' fill='white'>?</text></svg>">
[[MD_CSS]]
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#8e8e93;--text3:#c7c7cc;
  --border:#e5e5ea;--chip-bg:#f0f0f5;--chip-hover:#e5f0ff;
  --bubble-bg:#edf3ff;--reply-bg:#fff;--dismiss-bg:#f2f2f7;
  --dismiss-fg:#3c3c43;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#fff;--text2:#8e8e93;--text3:#48484a;
  --border:#38383a;--chip-bg:#2c2c2e;--chip-hover:#1a3460;
  --bubble-bg:#0a2560;--reply-bg:#1c1c1e;--dismiss-bg:#2c2c2e;
  --dismiss-fg:#ebebf5;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background:var(--bg);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:32px 16px;gap:10px;
}

/* ── AI message card ── */
.ai-card{
  background:var(--card);border-radius:20px;width:100%;max-width:560px;
  box-shadow:0 6px 32px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);overflow:hidden;
}
.header{display:flex;align-items:center;padding:16px 18px;gap:12px}
.avatar{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#007aff 0%,#5856d6 50%,#af52de 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,122,255,.25);
}
.avatar svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.header-info{flex:1;min-width:0}
.header-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
.header-sub{font-size:11.5px;color:var(--text2);margin-top:1px}
.header-sub:empty{display:none}
.timer-area{display:flex;align-items:center;gap:8px;position:relative}
.copy-msg-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;padding:0;border-radius:6px;
  background:transparent;border:1px solid var(--border);
  color:var(--text2);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,transform .08s;
  font-family:inherit;opacity:.75;
}
.copy-msg-btn:hover{background:var(--chip-bg);border-color:var(--text2);color:var(--text);opacity:1}
.copy-msg-btn:active{transform:scale(.92)}
.copy-msg-btn.copied{background:#34c759;border-color:#34c759;color:#fff;opacity:1}
.copy-msg-btn svg{display:block}
.timer-badge{
  font-size:12px;font-weight:600;color:var(--text2);
  font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default;
}
.timer-badge::after{
  content:'Closes when time runs out';
  position:absolute;right:0;top:calc(100% + 5px);
  background:var(--text);color:var(--card);
  font-size:11px;font-weight:400;
  padding:4px 8px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.timer-badge:hover::after{opacity:1}
.timer-badge.urgent{color:#ff3b30}
.timer-badge.paused{color:#34c759}
.msg-area{padding:0 18px 14px}
.bubble{
  background:var(--bubble-bg);border-radius:4px 14px 14px 14px;
  padding:12px 14px;font-size:14px;color:var(--text);line-height:1.6;
}
/* ── Details card ── */
.details-card{
  background:var(--card);border-radius:20px;width:100%;max-width:560px;
  box-shadow:0 6px 32px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);overflow:hidden;
}
.details-body{
  font-size:13px;color:var(--text2);line-height:1.6;
  padding:14px 18px;
}
/* ── Chips card ── */
.chips-card{
  background:var(--card);border-radius:20px;width:100%;max-width:560px;
  box-shadow:0 6px 32px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);overflow:hidden;
}
.chips-card .suggested-label{
  font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.5px;padding:12px 18px 8px;
}
.chips-row{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 14px;align-items:flex-start}
.chip{
  display:inline-block;vertical-align:middle;
  padding:6px 13px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--chip-bg);color:var(--text);cursor:pointer;font-size:13px;
  font-family:inherit;line-height:1.4;user-select:none;transition:all .15s;
  text-align:left;max-width:100%;word-break:break-word;
}
/* Inline markdown inside chips renders as plain text — strip block margins
   and keep code/strong/em rendering visually consistent with chip body. */
.chip>*{margin:0}
.chip code{
  background:rgba(0,122,255,.10);color:inherit;
  padding:1px 5px;border-radius:4px;font-size:.92em;
}
.chip:hover code{background:rgba(0,122,255,.18)}
.chip.sel code{background:rgba(255,255,255,.22);color:#fff}
.chip a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.chip strong{font-weight:600}
.chip:hover{border-color:#007aff;background:var(--chip-hover);color:#007aff}
.chip.sel{background:#007aff;border-color:#007aff;color:#fff;font-weight:500}
/* ── Reply card ── */
.reply-card{
  background:var(--reply-bg);border-radius:20px;width:100%;max-width:560px;
  box-shadow:0 6px 32px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);
  overflow:hidden;border:1.5px solid var(--border);
}
.reply-tabs{
  display:flex;align-items:center;gap:0;padding:10px 16px 0;border-bottom:1px solid var(--border);
}
.reply-tab{
  font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
  padding:4px 10px 8px;cursor:pointer;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
  background:transparent;font-family:inherit;
  user-select:none;transition:color .15s,border-color .15s;
}
.reply-tab.active{color:var(--text);border-bottom-color:#007aff;}
.reply-tab:hover:not(.active){color:var(--text);}
textarea{
  width:100%;min-height:90px;max-height:40vh;height:auto;
  border:none;padding:10px 16px 12px;
  font:14px/1.55 -apple-system,sans-serif;color:var(--text);
  resize:none;outline:none;background:transparent;overflow-y:auto;
}
textarea::placeholder{color:var(--text3)}
.md-preview{
  min-height:90px;padding:10px 16px 12px;
  font-size:14px;line-height:1.55;color:var(--text);
  display:none;
}
.reply-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px 12px;border-top:1px solid var(--border);gap:8px;
}
.hint{font-size:11px;color:var(--text3)}
.char-count{font-size:11px;color:var(--text3);transition:color .2s}
.char-count.warn{color:#ff9f0a}
.char-count.limit{color:#ff3b30}
.actions{display:flex;gap:8px}
.btn{
  padding:8px 16px;border-radius:9px;border:none;cursor:pointer;
  font-size:13px;font-weight:500;font-family:inherit;line-height:1;transition:all .15s;
}
.btn-dismiss{background:var(--dismiss-bg);color:var(--dismiss-fg);min-width:104px;white-space:nowrap}
.btn-dismiss:hover{opacity:.7}
.btn-send{background:#007aff;color:#fff;padding:8px 20px;min-width:170px;white-space:nowrap}
.btn-send:not(:disabled):hover{background:#0066d6}
.btn-send:disabled{opacity:.35;cursor:not-allowed}
/* Double-tap confirm state — both Send and No-Reply require two activations
 * within ~3 s (mouse clicks or keyboard Enter on a focused button) so the
 * user can never fire either action by a single accidental press. */
.btn.confirming{
  background:#ff9500;border-color:#ff9500;color:#fff;
  animation:confirm-pulse 1s ease-in-out infinite;
}
.btn-dismiss.confirming{background:#ff9500;border-color:#ff9500;color:#fff}
.btn-send.confirming{background:#ff9500}
.btn-send.confirming:not(:disabled):hover{background:#e68600}
@keyframes confirm-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,149,0,.45)}
  50%{box-shadow:0 0 0 6px rgba(255,149,0,0)}
}
/* ── Progress bar ── */
.progress{height:3px;background:var(--border);overflow:hidden}
.progress-fill{
  height:100%;background:linear-gradient(90deg,#5856d6,#007aff);
  transition:width 1s linear;
}
/* ── User reply card (post-send) ── */
@keyframes slide-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.user-card{
  background:var(--card);border-radius:20px;width:100%;max-width:560px;
  box-shadow:0 6px 32px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);
  overflow:hidden;animation:slide-up .3s ease;
}
.ur-header{display:flex;align-items:center;padding:14px 18px 12px;gap:10px;border-bottom:1px solid var(--border)}
.ur-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(140deg,#34c759,#30d158);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ur-avatar svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ur-info{flex:1}
.ur-name{font-size:13px;font-weight:600;color:var(--text)}
.ur-sublabel{font-size:11px;color:var(--text2);margin-top:1px}
.ur-body{padding:14px 18px;min-height:44px}
.ur-chip-badge{
  display:inline-block;background:#007aff;color:#fff;
  padding:4px 12px;border-radius:12px;
  font-size:13px;font-weight:500;margin-bottom:8px;
  max-width:100%;word-break:break-word;
}
.ur-chip-badge>*{margin:0}
.ur-chip-badge code{
  background:rgba(255,255,255,.22);color:#fff;
  padding:1px 5px;border-radius:4px;font-size:.92em;
}
.ur-chip-badge a{color:#fff;text-decoration:underline}
.ur-chip-badge strong{font-weight:700}
.ur-notes{font-size:14px;line-height:1.6;color:var(--text);word-break:break-word}
.ur-dismissed{font-size:14px;color:var(--text3);font-style:italic}
.ur-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 14px;border-top:1px solid var(--border);gap:8px;
}
.ur-processing{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.processing-dots{display:flex;gap:3px;align-items:center}
.processing-dots span{
  width:5px;height:5px;border-radius:50%;background:#007aff;animation:pd .9s infinite;
}
.processing-dots span:nth-child(2){animation-delay:.2s}
.processing-dots span:nth-child(3){animation-delay:.4s}
@keyframes pd{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.btn-close-tab{
  padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--chip-bg);color:var(--text);cursor:pointer;
  font-size:12px;font-family:inherit;font-weight:500;line-height:1;transition:all .15s;
  white-space:nowrap;
}
.btn-close-tab:hover{border-color:#007aff;background:var(--chip-hover);color:#007aff}
.btn-close-tab kbd{
  font-family:inherit;font-size:10px;font-weight:400;
  background:rgba(0,0,0,.08);padding:1px 5px;border-radius:3px;margin-left:4px;
}
/* AI card: asked-time badge replaces countdown after send */
.asked-badge{font-size:11px;color:var(--text3)!important}
.asked-badge::after{display:none!important}
/* ── Live updates (AI → dialog) ── */
.updates-panel{border-top:1px solid var(--border);max-height:200px;overflow-y:auto;padding:8px 18px 6px;scroll-behavior:smooth}
.upd-item{display:flex;gap:10px;align-items:flex-start;padding:4px 0;animation:upd-in .25s ease}
@keyframes upd-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.upd-dot{width:6px;height:6px;border-radius:50%;background:#007aff;margin-top:5px;flex-shrink:0}
.upd-body{flex:1;min-width:0}
.upd-text{font-size:13px;color:var(--text2);line-height:1.5;word-break:break-word}
.upd-time{font-size:10px;color:var(--text3);margin-top:2px}
</style>
</head>
<body>

<div class="ai-card" id="aiCard">
  <div class="header">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M9.5 2a1.5 1.5 0 0 0 0 3h.5v1.02A6.5 6.5 0 0 0 5.5 12.5v.5H5a1.5 1.5 0 0 0 0 3h1v.5a6.48 6.48 0 0 0 2.05 4.74l-.76.76a1.5 1.5 0 1 0 2.12 2.12l.85-.85c.55.15 1.14.23 1.74.23s1.19-.08 1.74-.23l.85.85a1.5 1.5 0 1 0 2.12-2.12l-.76-.76A6.48 6.48 0 0 0 18 16.5V16h1a1.5 1.5 0 0 0 0-3h-.5v-.5A6.5 6.5 0 0 0 14 6.02V5h.5a1.5 1.5 0 0 0 0-3h-5zM10 12a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm4 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#fff" stroke="none"/></svg>
    </div>
    <div class="header-info">
      <div class="header-name">[[TITLE]]</div>
      <div class="header-sub">[[SUBTITLE]]</div>
    </div>
    <div class="timer-area">
      <button class="copy-msg-btn" id="copyMsgBtn" onclick="copyResponse(this)" title="Copy entire AI message as markdown">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M5.75 1A1.75 1.75 0 0 0 4 2.75v9.5C4 13.216 4.784 14 5.75 14h7.5A1.75 1.75 0 0 0 15 12.25v-9.5A1.75 1.75 0 0 0 13.25 1h-7.5zm-.25 1.75a.25.25 0 0 1 .25-.25h7.5a.25.25 0 0 1 .25.25v9.5a.25.25 0 0 1-.25.25h-7.5a.25.25 0 0 1-.25-.25v-9.5z"/><path fill="currentColor" d="M2.5 5.5A.75.75 0 0 0 1.75 6.25v7A1.75 1.75 0 0 0 3.5 15h7a.75.75 0 0 0 0-1.5h-7a.25.25 0 0 1-.25-.25v-7a.75.75 0 0 0-.75-.75z"/></svg>
      </button>
      <div class="timer-badge" id="tbadge"></div>
    </div>
  </div>
  <div class="msg-area">
    <div class="bubble md-body" id="questionBubble">[[QUESTION]]</div>
  </div>
  <div class="updates-panel" id="updatesPanel" style="display:none"></div>
</div>

[[DETAILS_SECTION]]

[[CHIPS_SECTION]]

<div class="reply-card" id="replyCard">
  <div class="reply-tabs">
    <button class="reply-tab active" id="tabWrite" onclick="switchTab('write')">Write</button>
    <button class="reply-tab" id="tabPreview" onclick="switchTab('preview')">Preview</button>
  </div>
  <textarea id="ans" placeholder="Type your reply&#x2026; (or tap a suggestion above)"></textarea>
  <div class="md-preview md-body" id="mdPreview"></div>
  <div class="reply-footer">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="hint" id="kbHint">&#8984;&#8629; to send</div>
      <div class="char-count" id="charCount"></div>
    </div>
    <div class="actions">
      <button class="btn btn-dismiss" id="dismissBtn" onclick="confirmDismiss()" title="Close without sending a reply">No Reply</button>
      <button class="btn btn-send" id="sendBtn" onclick="confirmSend()" disabled>Send Reply &#x2192;</button>
    </div>
  </div>
  <div class="progress"><div class="progress-fill" id="pfill" style="width:100%"></div></div>
</div>
</div>

[[MD_JS]]
<script>
var QUESTION_RAW = [[QUESTION_JSON]];
var DETAILS_RAW = [[DETAILS_JSON]];

// mdInline renders short inline-flavoured markdown (bold/italic/code/links)
// without wrapping in a paragraph. Used for chips and chip badges where
// the surrounding element supplies its own block-level layout.
function mdInline(raw){
  if(!raw) return '';
  var html = mdRender(raw).trim();
  var m = html.match(/^<p>([\s\S]*)<\/p>$/);
  return m ? m[1] : html;
}

// Render the AI question bubble and details as markdown.
(function(){
  var b=document.getElementById('questionBubble');
  if(b && QUESTION_RAW){b.innerHTML=mdRender(QUESTION_RAW);}
  if(DETAILS_RAW){
    var d=document.getElementById('detailsBody');
    if(d){d.innerHTML=mdRender(DETAILS_RAW);}
  }
  // Render inline markdown inside chip buttons. Server stamps raw markdown
  // into data-md (URI-encoded); we decode and pass through mdInline so chip
  // labels can show **bold**, `code`, [links](...), etc.
  document.querySelectorAll('.chip[data-md]').forEach(function(c){
    try{
      var raw = decodeURIComponent(c.getAttribute('data-md'));
      c.innerHTML = mdInline(raw);
    }catch(e){}
  });
})();

var total=[[TIMEOUT_SEC]],rem=total,selIdx=-1,selVal='',dialogDone=false;
var timerPaused=false, resumeTimer=null;

var badge=document.getElementById('tbadge');
badge.textContent=fmtSec(rem);

var iv=setInterval(function(){
  if(timerPaused)return;
  rem--;
  document.getElementById('pfill').style.width=(rem/total*100)+'%';
  badge.textContent=fmtSec(rem);
  if(rem<=60){badge.classList.add('urgent');badge.classList.remove('paused');}
  else{badge.classList.remove('urgent');}
  if(rem<=0){clearInterval(iv);done(null);}
},1000);

function pauseTimer(){
  timerPaused=true;
  badge.classList.remove('urgent');
  badge.classList.add('paused');
  badge.textContent='⏸ '+fmtSec(rem);
  if(resumeTimer){clearTimeout(resumeTimer);}
  resumeTimer=setTimeout(function(){
    timerPaused=false;
    badge.classList.remove('paused');
    badge.textContent=fmtSec(rem);
    if(rem<=60)badge.classList.add('urgent');
  },3000);
}

function extendTime(){}

function updateSend(){
  var canSend=selVal!==''||document.getElementById('ans').value.trim()!=='';
  document.getElementById('sendBtn').disabled=!canSend;
}

function pickChip(val,idx){
  document.querySelectorAll('.chip').forEach(function(s){s.classList.remove('sel');});
  rem=total;document.getElementById('pfill').style.width='100%';
  badge.textContent=fmtSec(rem); badge.classList.remove('urgent');
  pauseTimer();
  if(selIdx===idx){selIdx=-1;selVal='';}
  else{
    document.getElementById('chip'+idx).classList.add('sel');
    selIdx=idx;selVal=val;
  }
  updateSend();
}

function sendAnswer(){
  var notes=document.getElementById('ans').value.trim();
  done({choice:selVal,notes:notes});
}

// Two-step confirmation guards both Send and No-Reply so a stray click or
// Enter press can never fire the action. The button enters a pulsing orange
// "Press again to confirm" state for 3 s; second activation fires; otherwise
// it auto-reverts. Edge cases handled:
//   - Activating a different confirm button cancels the previous one.
//   - Any click / keydown / focus outside the confirming button cancels it.
//   - Window blur (tab switch) cancels all pending confirms.
var dc = DoubleConfirm();
function confirmSend(){ dc.arm('sendBtn', sendAnswer, 'Press again to send'); }
function confirmDismiss(){ dc.arm('dismissBtn', function(){ done(null); }, 'Press again to dismiss'); }
document.addEventListener('mousedown', function(e){
  var t = e.target;
  while(t && t !== document){
    if(t.id === 'sendBtn' || t.id === 'dismissBtn') return;
    t = t.parentNode;
  }
  dc.reset();
}, true);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ dc.reset(); return; }
  var a = document.activeElement;
  if(a && (a.id === 'sendBtn' || a.id === 'dismissBtn')) return;
  if(e.key === 'Enter' && a && a.id === 'ans') return;
  if(dc.active() && a && a.tagName !== 'BUTTON') dc.reset();
}, true);
window.addEventListener('blur', function(){ dc.reset(); });

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Copy the entire AI message (question + details) as raw markdown.
function copyResponse(btn){
  var parts=[];
  if(typeof QUESTION_RAW==='string'&&QUESTION_RAW.trim())parts.push(QUESTION_RAW.trim());
  if(typeof DETAILS_RAW==='string'&&DETAILS_RAW.trim())parts.push(DETAILS_RAW.trim());
  clipCopy(parts.join('\n\n---\n\n'),function(){
    btn.classList.add('copied');
    setTimeout(function(){btn.classList.remove('copied');},1500);
  });
}

function done(payload){
  dialogDone=true;
  clearInterval(iv);
  if(resumeTimer){clearTimeout(resumeTimer);}
  if(_sse){_sse.close();_sse=null;}
  var combined=payload?(payload.choice?(payload.choice+(payload.notes?'\n\n'+payload.notes:'')):payload.notes):'';
  var isDismissed=!combined.trim();
  // Always include `dismissed` so the server can skip retrying on an explicit dismissal.
  var body=JSON.stringify(Object.assign({},payload||{},{dismissed:isDismissed}));
  var FAVICON_SENT="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%2334c759'/><path d='M8 16l5 6 11-11' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>";
  var FAVICON_ERR="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23ff3b30'/><text x='16' y='22' font-family='system-ui' font-size='20' font-weight='bold' text-anchor='middle' fill='white'>!</text></svg>";
  function setFavicon(url){var f=document.getElementById('favicon');if(f)f.href=url;}
  fetch('/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:body})
    .then(function(r){
      if(!isDismissed){
        var sa=document.getElementById('statusArea');
        if(sa)sa.innerHTML='<span style="color:#34c759;font-size:12px">&#10003; Message sent</span>';
        setFavicon(FAVICON_SENT);
      }
    })
    .catch(function(){
      if(!isDismissed){
        var sa=document.getElementById('statusArea');
        if(sa)sa.innerHTML='<span style="color:#ff3b30;font-size:12px">&#9888; Failed to send</span>';
        setFavicon(FAVICON_ERR);
      }
    });

  var now=new Date();
  var timeStr=(now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();

  var isMac=/Mac|iPhone|iPad/.test(navigator.userAgentData?.platform||navigator.userAgent);
  var closeKey=isMac?'\u2318W':'Ctrl+W';

  // Card 1: Freeze AI card — replace countdown with 'Asked HH:MM', lock chips.
  var tbadge=document.getElementById('tbadge');
  tbadge.textContent='Asked '+timeStr;
  tbadge.className='asked-badge';
  document.querySelectorAll('.chip').forEach(function(c){c.style.pointerEvents='none';});

  // Card 2: Transform reply card → user reply card.
  var rc=document.getElementById('replyCard');
  rc.className='user-card';
  rc.style.display='block';

  var chipHtml='';
  if(payload&&payload.choice){chipHtml='<div><span class="ur-chip-badge">'+mdInline(payload.choice)+'</span></div>';}
  var notesHtml='';
  if(payload&&payload.notes&&payload.notes.trim()){notesHtml='<div class="ur-notes md-body">'+mdRender(payload.notes.trim())+'</div>';}
  var bodyContent=isDismissed?'<div class="ur-dismissed">No reply was sent</div>':chipHtml+notesHtml;

  var sublabel=isDismissed?'Dismissed':'Replied at '+timeStr;
  var processingHtml=isDismissed?'<span style="color:var(--text2);font-size:12px">\u2715 No reply sent</span>':
    '<div class="ur-processing" id="statusArea">'+
      '<div class="processing-dots"><span></span><span></span><span></span></div>'+
      '<span>Sending reply\u2026</span>'+
    '</div>';

  // Stash the raw reply so the copy button can grab it (chip badge + notes
  // joined as markdown). Skipped when dismissed — nothing meaningful to copy.
  var copyBtnHtml='';
  if(!isDismissed){
    var replyParts=[];
    if(payload&&payload.choice)replyParts.push(payload.choice);
    if(payload&&payload.notes&&payload.notes.trim())replyParts.push(payload.notes.trim());
    window.__USER_REPLY_RAW__=replyParts.join('\n\n');
    copyBtnHtml='<button class="copy-msg-btn" id="copyReplyBtn" onclick="copyReply(this)" title="Copy your reply as markdown">'+
      '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M5.75 1A1.75 1.75 0 0 0 4 2.75v9.5C4 13.216 4.784 14 5.75 14h7.5A1.75 1.75 0 0 0 15 12.25v-9.5A1.75 1.75 0 0 0 13.25 1h-7.5zm-.25 1.75a.25.25 0 0 1 .25-.25h7.5a.25.25 0 0 1 .25.25v9.5a.25.25 0 0 1-.25.25h-7.5a.25.25 0 0 1-.25-.25v-9.5z"/><path fill="currentColor" d="M2.5 5.5A.75.75 0 0 0 1.75 6.25v7A1.75 1.75 0 0 0 3.5 15h7a.75.75 0 0 0 0-1.5h-7a.25.25 0 0 1-.25-.25v-7a.75.75 0 0 0-.75-.75z"/></svg>'+
      '</button>';
  }

  rc.innerHTML=
    '<div class="ur-header">'+
      '<div class="ur-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>'+
      '<div class="ur-info"><div class="ur-name">You</div><div class="ur-sublabel">'+sublabel+'</div></div>'+
      copyBtnHtml+
    '</div>'+
    '<div class="ur-body">'+bodyContent+'</div>'+
    '<div class="ur-footer">'+
      processingHtml+
      '<button class="btn-close-tab" onclick="window.close()">Close tab <kbd>'+escHtml(closeKey)+'</kbd></button>'+
    '</div>';
}

// Copy the user's submitted reply (chip + notes) as markdown.
function copyReply(btn){
  clipCopy(window.__USER_REPLY_RAW__||'',function(){
    btn.classList.add('copied');
    setTimeout(function(){btn.classList.remove('copied');},1500);
  });
}

// Write / Preview tab toggle for the freeform reply textarea.
function switchTab(tab){
  var ta=document.getElementById('ans');
  var preview=document.getElementById('mdPreview');
  var tw=document.getElementById('tabWrite');
  var tp=document.getElementById('tabPreview');
  if(tab==='preview'){
    var raw=ta.value;
    preview.innerHTML=raw.trim()?mdRender(raw):'<em style="color:var(--text3)">Nothing to preview yet\u2026</em>';
    ta.style.display='none';
    preview.style.display='block';
    tw.classList.remove('active');tp.classList.add('active');
  } else {
    ta.style.display='';
    preview.style.display='none';
    tw.classList.add('active');tp.classList.remove('active');
    ta.focus();
  }
}

var ta=document.getElementById('ans');
var charCountEl=document.getElementById('charCount');
// Cap auto-grow at 40% of viewport so the page doesn't scroll on every
// keystroke once the reply gets long. Beyond the cap, the textarea scrolls
// internally — the cursor stays put and the page layout doesn't shift.
var TA_MAX_PX = function(){return Math.floor(window.innerHeight * 0.40);};
var taOverflowed=false;
ta.addEventListener('input',function(){
  this.style.height='auto';
  var maxPx=TA_MAX_PX();
  var target=Math.min(this.scrollHeight, maxPx);
  this.style.height=target+'px';
  // First time we hit the cap, scroll the reply card into view so the user
  // can see what they're typing. After that, leave the page scroll alone.
  if(this.scrollHeight>maxPx && !taOverflowed){
    taOverflowed=true;
    document.getElementById('replyCard').scrollIntoView({block:'end',behavior:'smooth'});
  } else if(this.scrollHeight<=maxPx){
    taOverflowed=false;
  }
  updateSend();
  // Update character counter
  var len=this.value.length;
  if(len>0){
    charCountEl.textContent=len+' char'+(len===1?'':'s');
    charCountEl.className='char-count'+(len>1200?' limit':len>800?' warn':'');
  } else {
    charCountEl.textContent='';
  }
  // If the textarea has content, freeze the timer completely — never auto-close
  // while the user is composing. Resume normal countdown only when they clear it.
  rem=total;
  document.getElementById('pfill').style.width='100%';
  badge.classList.remove('urgent');
  if(this.value.trim()){
    timerPaused=true;
    if(resumeTimer){clearTimeout(resumeTimer);resumeTimer=null;}
    badge.classList.add('paused');
    badge.textContent='\u23f8 \u2014 reply in progress';
  } else {
    pauseTimer();
  }
});
ta.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.metaKey&&!e.ctrlKey&&!document.getElementById('sendBtn').disabled){
    e.preventDefault();
    confirmSend();
  }
});
ta.focus();

// Platform-adaptive keyboard shortcut hint
(function(){
  var isMac=/Mac|iPhone|iPad/.test(navigator.userAgentData?.platform||navigator.userAgent);
  var el=document.getElementById('kbHint');
  if(el)el.textContent='↩ tap twice to send  ·  ⇧↩ new line';
})();

// AI → dialog live updates via Server-Sent Events.
// Messages from update_dialog appear instantly in the updates panel.
var _sse = null;
(function(){
  if(!window.EventSource) return;
  var panel = document.getElementById('updatesPanel');
  _sse = new EventSource('/updates');
  _sse.onmessage = function(e){
    var msg;
    try { var p=JSON.parse(e.data); msg=typeof p==='string'?p:e.data; } catch(ex) { msg=e.data; }
    if(msg === '__DISMISS__'){
      done(null);
      _sse.close(); _sse = null;
      return;
    }
    var isReplace = msg.indexOf('__REPLACE__') === 0;
    if(isReplace) msg = msg.slice('__REPLACE__'.length);
    panel.style.display = 'block';
    var now = new Date();
    var t = (now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    if(isReplace && panel.lastChild){
      var last = panel.lastChild;
      last.querySelector('.upd-text').innerHTML = mdRender(msg);
      last.querySelector('.upd-time').textContent = t;
      panel.scrollTop = panel.scrollHeight;
      return;
    }
    var item = document.createElement('div');
    item.className = 'upd-item';
    item.innerHTML = '<div class="upd-dot"></div><div class="upd-body"><div class="upd-text"></div><div class="upd-time">' + t + '</div></div>';
    item.querySelector('.upd-text').innerHTML = mdRender(msg);
    panel.appendChild(item);
    panel.scrollTop = panel.scrollHeight;
  };
  _sse.onerror = function(){ _sse.close(); _sse = null; };
})();
window.addEventListener('beforeunload', function(){ if(_sse){ _sse.close(); _sse = null; } });

// Heartbeat: report user activity to the server every 5 s so the AI can see
// whether the user is typing, idle, or has left — used by get_user_response.
(function(){
  var lastActivity=Date.now();
  var isTyping=false;
  function touch(){lastActivity=Date.now();}
  document.addEventListener('mousemove',touch,{passive:true});
  document.addEventListener('keydown',touch,{passive:true});
  document.getElementById('ans').addEventListener('input',function(){
    touch();
    isTyping=this.value.trim().length>0;
  });
  setInterval(function(){
    if(dialogDone)return;
    var idle=(Date.now()-lastActivity)/1000;
    fetch('/heartbeat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({typing:isTyping,idle_seconds:idle})
    }).catch(function(){});
  },5000);
})();
</script>
