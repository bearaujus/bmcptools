<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[[TITLE]]</title>
[[MD_CSS]]
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#8e8e93;--text3:#c7c7cc;
  --border:#e5e5ea;--input-bg:#fff;
  --ai-bubble:#edf3ff;--ai-text:#1c1c1e;
  --user-bubble:#007aff;--user-text:#fff;
  --waiting-bg:#fff9e6;--waiting-text:#b07800;--waiting-border:#ffe08a;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#fff;--text2:#8e8e93;--text3:#48484a;
  --border:#38383a;--input-bg:#2c2c2e;
  --ai-bubble:#0a2560;--ai-text:#fff;
  --user-bubble:#0a84ff;--user-text:#fff;
  --waiting-bg:#2c2200;--waiting-text:#ffd060;--waiting-border:#6e5000;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background:var(--bg);display:flex;flex-direction:column;
  height:100%;overflow:hidden;
}
/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;padding:12px 16px;gap:10px;
  background:var(--card);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(140deg,#007aff,#5856d6);
  display:flex;align-items:center;justify-content:center;
}
.avatar svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-info{flex:1}
.topbar-name{font-size:14px;font-weight:600;color:var(--text)}
.topbar-sub{font-size:11px;color:var(--text2)}
.topbar-sub:empty{display:none}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:#34c759;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.close-btn{
  font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);background:transparent;color:var(--text2);
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.close-btn:hover{border-color:#ff3b30;color:#ff3b30}
/* ── Messages ── */
.messages{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:8px;
  scroll-behavior:smooth;
}
.msg{display:flex;gap:8px;align-items:flex-end;animation:msg-in .2s ease}
@keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.ai{justify-content:flex-start}
.msg.user{justify-content:flex-end}
.msg-avatar{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;margin-bottom:2px;
  background:linear-gradient(140deg,#007aff,#5856d6);
  display:flex;align-items:center;justify-content:center;
}
.msg-avatar svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bubble{
  max-width:72%;padding:9px 13px;border-radius:18px;
  font-size:14px;line-height:1.55;word-break:break-word;
}
.msg.ai .bubble{
  background:var(--ai-bubble);color:var(--ai-text);
  border-bottom-left-radius:4px;
}
.msg.user .bubble{
  background:var(--user-bubble);color:var(--user-text);
  border-bottom-right-radius:4px;white-space:pre-wrap;
}
.msg-time{font-size:10px;color:var(--text3);margin:2px 4px 0;align-self:flex-end;flex-shrink:0}
.read-receipt{font-size:10px;color:var(--text3);align-self:flex-end;flex-shrink:0;margin-bottom:1px}
/* ── AI waiting banner ── */
.waiting-banner{
  display:none;align-items:center;gap:8px;
  padding:7px 14px;margin:0 16px 4px;border-radius:12px;
  background:var(--waiting-bg);border:1px solid var(--waiting-border);
  font-size:12px;color:var(--waiting-text);font-weight:500;
  animation:fade-in .25s ease;
}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.waiting-dots{display:flex;gap:3px;align-items:center}
.waiting-dots span{
  width:5px;height:5px;border-radius:50%;background:var(--waiting-text);
  animation:bounce .9s infinite;
}
.waiting-dots span:nth-child(2){animation-delay:.18s}
.waiting-dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
.waiting-text{flex:1}
/* ── Input bar ── */
.input-bar{
  display:flex;flex-direction:column;
  padding:10px 12px 12px;background:var(--card);border-top:1px solid var(--border);
  flex-shrink:0;gap:6px;
}
.input-row{display:flex;align-items:flex-end;gap:8px}
textarea{
  flex:1;min-height:36px;max-height:120px;height:36px;
  background:var(--input-bg);border:1.5px solid var(--border);
  border-radius:18px;padding:7px 14px;
  font:14px/1.45 -apple-system,sans-serif;color:var(--text);
  resize:none;outline:none;overflow:hidden;transition:border-color .15s;
}
textarea:focus{border-color:#007aff}
textarea::placeholder{color:var(--text3)}
.send-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:#007aff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
.send-btn:disabled{background:var(--border);cursor:not-allowed}
.send-btn:not(:disabled):hover{background:#0066d6}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.input-hint{font-size:11px;color:var(--text3);padding:0 4px;text-align:right}
/* ── Typing indicator ── */
.typing-indicator{
  display:none;padding:4px 12px;
}
.typing-dots{display:flex;gap:4px;align-items:center;height:20px}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--text3);
  animation:bounce .8s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
/* ── Closed overlay ── */
.closed-banner{
  display:none;text-align:center;padding:10px 16px;
  background:#ff3b3015;color:#ff3b30;
  font-size:13px;font-weight:500;
  border-top:1px solid #ff3b3030;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="avatar">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.8L20 8l-4 3.8.9 5.2L12 14.5l-4.9 2.5.9-5.2L4 8l5.6-1.2z"/></svg>
  </div>
  <div class="topbar-info">
    <div class="topbar-name">[[TITLE]]</div>
    <div class="topbar-sub">[[SUBTITLE]]</div>
  </div>
  <div class="status-dot" id="statusDot"></div>
  <button class="close-btn" onclick="closeChat()">Close Chat</button>
</div>

<div class="messages" id="messages"></div>

<div class="typing-indicator" id="typingIndicator">
  <div class="typing-dots"><span></span><span></span><span></span></div>
</div>

<!-- AI waiting banner: shown when get_chat_messages is blocking for a reply -->
<div class="waiting-banner" id="waitingBanner">
  <div class="waiting-dots"><span></span><span></span><span></span></div>
  <div class="waiting-text">AI is waiting for your reply — you can send multiple messages</div>
</div>

<div class="closed-banner" id="closedBanner">
  Chat closed by the AI — you can close this tab.
</div>

<div class="input-bar">
  <div class="input-row">
    <textarea id="inp" placeholder="Type a message… (you can send multiple before AI reads)" rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint" id="kbHint"></div>
</div>

[[MD_JS]]
<script>
// Markdown + copyCode loaded from [[MD_JS]] above — mdRender and copyCode are available globally.

var messages=document.getElementById('messages');
var inp=document.getElementById('inp');
var sendBtn=document.getElementById('sendBtn');
var closed=false;
var lastUserReceiptEl=null;

// Platform-adaptive keyboard shortcut hint
(function(){
  var isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
  document.getElementById('kbHint').textContent=isMac?'⌘↩ to send':'Ctrl+Enter to send';
})();

function now(){
  var d=new Date();
  var h=d.getHours(),m=d.getMinutes();
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}

function appendMsg(side, text){
  var row=document.createElement('div');
  row.className='msg '+side;
  var avatarHtml=side==='ai'
    ? '<div class="msg-avatar"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.8L20 8l-4 3.8.9 5.2L12 14.5l-4.9 2.5.9-5.2L4 8l5.6-1.2z"/></svg></div>'
    : '';
  var bubble=document.createElement('div');
  bubble.className = side==='ai' ? 'bubble md-body' : 'bubble';
  var rawText = text.replace(/\\n/g,'\n');
  if(side==='ai'){
    bubble.innerHTML=mdRender(rawText);
  } else {
    bubble.textContent=rawText;
  }
  if(side==='ai'){
    if(avatarHtml){var av=document.createElement('div');av.innerHTML=avatarHtml;row.appendChild(av.firstChild);}
    row.appendChild(bubble);
    var t=document.createElement('div');t.className='msg-time';t.textContent=now();row.appendChild(t);
  } else {
    var t2=document.createElement('div');t2.className='msg-time';t2.textContent=now();row.appendChild(t2);
    row.appendChild(bubble);
    var receipt=document.createElement('span');receipt.className='read-receipt';receipt.textContent='✓';
    row.appendChild(receipt);
    lastUserReceiptEl=receipt;
  }
  messages.appendChild(row);
  messages.scrollTop=messages.scrollHeight;
}

function sendMessage(){
  var text=inp.value.trim();
  if(!text||closed)return;
  appendMsg('user',text);
  inp.value='';
  inp.style.height='36px';
  sendBtn.disabled=true;
  fetch('/message',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text})
  }).catch(function(){});
}

function closeChat(){
  if(closed)return;
  fetch('/close',{method:'POST'}).catch(function(){});
  markClosed();
}

function markClosed(){
  closed=true;
  document.getElementById('statusDot').style.background='#ff3b30';
  document.getElementById('statusDot').style.animation='none';
  document.getElementById('closedBanner').style.display='block';
  document.getElementById('waitingBanner').style.display='none';
  inp.disabled=true;
  sendBtn.disabled=true;
  inp.placeholder='Chat closed';
}

// Input auto-resize and send button enable
inp.addEventListener('input',function(){
  this.style.height='36px';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
  sendBtn.disabled=this.value.trim()===''||closed;
});
inp.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!sendBtn.disabled){
    sendMessage();
  }
});

// SSE: receive AI messages and status events
var es=new EventSource('/events');
es.onopen=function(){
  document.getElementById('statusDot').style.background='#34c759';
};
es.onmessage=function(e){
  document.getElementById('typingIndicator').style.display='none';
  appendMsg('ai',e.data);
  // Notify server that user has seen the AI message (tab must be visible).
  if(!closed&&document.visibilityState==='visible'){
    fetch('/seen',{method:'POST'}).catch(function(){});
  }
};
// ai_status event: "waiting" shows the banner, "read" updates receipt, anything else hides banner
es.addEventListener('ai_status',function(e){
  var banner=document.getElementById('waitingBanner');
  if(e.data==='waiting'){
    banner.style.display='flex';
    messages.scrollTop=messages.scrollHeight;
  } else if(e.data==='read'){
    if(lastUserReceiptEl){
      lastUserReceiptEl.textContent='✓✓';
      lastUserReceiptEl.style.color='#4fc3f7';
    }
  } else {
    banner.style.display='none';
  }
});
es.addEventListener('closed',function(){
  es.close();
  markClosed();
});
es.onerror=function(){
  if(!closed){
    document.getElementById('statusDot').style.background='#ff9f0a';
  }
};
// When user switches back to this tab, notify the server they can see AI messages.
document.addEventListener('visibilitychange',function(){
  if(!closed&&document.visibilityState==='visible'){
    fetch('/seen',{method:'POST'}).catch(function(){});
  }
});
</script>
</body>
</html>
